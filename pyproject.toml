[project]
name = "gitpulse"
version = "0.1.0"
description = "Original GitHub audience tracker inspired by the documented GitPulse concept"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.135,<1", "uvicorn>=0.41,<1", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=9,<10", "mypy>=1.19,<2", "ruff>=0.16,<1", "pip-audit>=2.10,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["gitpulse"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]